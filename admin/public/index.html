<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Twinga Admin</title>
<style>
:root{--blue:#0077f7;--deep:#0a3fb5;--orange:#ff9a1f;--ink:#14213d;--bg:#f3f7fe;--card:#fff;--line:#e3eaf7;--muted:#5b6b88;--ok:#1e9e4a;--bad:#d93025;--soft:#f1f5fc;--shadow:0 6px 18px rgba(10,42,143,.08);color-scheme:light}
:root[data-theme="dark"]{--bg:#0b1220;--card:#121c31;--line:#243352;--ink:#e6eefc;--muted:#93a4c4;--soft:#0f1830;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--deep),var(--blue) 60%,#3aa4ff)}
.lbox{background:var(--card);border-radius:24px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(10,42,143,.35)}
.lbox h1{margin:0 0 4px;font-size:26px}.lbox p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--card)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;width:auto}
.btn:disabled{opacity:.5;cursor:default}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.org{background:var(--orange)}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--line)}.btn.sm{padding:6px 11px;font-size:13px}
.btn.full{width:100%;margin-top:18px;padding:14px}
.err{color:var(--bad);margin-top:10px;font-size:13px;min-height:18px}
header{background:linear-gradient(135deg,var(--deep),var(--blue) 70%,#3aa4ff);color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:30;box-shadow:0 6px 20px rgba(10,42,143,.25)}
.top{display:flex;align-items:center;gap:8px;max-width:1280px;margin:0 auto}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#ffc15e,var(--orange));display:grid;place-items:center;font-weight:800}
.top b{font-size:18px;white-space:nowrap}
.sw{position:relative;flex:1;min-width:0}
.sw input{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);color:#fff;padding:9px 12px;font-size:14px}
.sw input::placeholder{color:rgba(255,255,255,.75)}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
#sres{position:absolute;left:0;right:0;top:44px;background:var(--card);color:var(--ink);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.3);max-height:60vh;overflow:auto;z-index:40}
#sres div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}#sres small{color:var(--muted)}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1280px;margin:8px auto 0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:rgba(255,255,255,.8);padding:10px 12px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:var(--orange)}
nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--orange);color:#fff;font-size:11px;text-align:center}
main{max-width:1280px;margin:0 auto;padding:16px}
h2{margin:4px 0 12px;font-size:20px}h3{margin:0;font-size:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);display:block}.stat b{font-size:22px;display:block;margin-top:3px}.stat i{font-style:normal;font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--orange)}.stat.red b{color:var(--bad)}.stat.good b{color:var(--ok)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.click{cursor:pointer}.card.warn{border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,154,31,.25)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{border-radius:12px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.p-pending,.p-placed{background:#fff1dc;color:#b86a00}.p-approved,.p-paid,.p-delivered,.p-active{background:#e5f6ea;color:var(--ok)}
.p-rejected,.p-cancelled,.p-inactive{background:#fde8e6;color:var(--bad)}.p-accepted,.p-preparing,.p-ready,.p-picked{background:#e3eeff;color:var(--blue)}
.kv{margin:10px 0 0;display:grid;gap:4px;font-size:14px}.kv div{display:flex;gap:8px;justify-content:space-between}
.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;word-break:break-word}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.acts .btn{flex:1;min-width:110px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:30px;text-align:center;color:var(--muted)}
a.map{color:var(--blue);font-weight:600;text-decoration:none}
.copy{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:1px 8px;margin-left:6px;font-size:12px;cursor:pointer;color:var(--blue)}
details summary{cursor:pointer;color:var(--blue);font-weight:600;margin-top:10px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.form small{display:block;font-weight:400;color:var(--muted)}
.note{background:#fff7e8;border:1px solid #ffe2b0;border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px;color:#5a3b00}
:root[data-theme="dark"] .note{background:#2a2110;border-color:#5a4313;color:#ffe2b0}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.chart{width:100%;height:auto}.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#3aa4ff)}
.board{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start}
.col{background:var(--soft);border-radius:18px;padding:10px;min-height:100px}.col>h3{padding:4px 6px 10px}
.col .card{margin-bottom:10px;padding:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#mbox{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
@media(min-width:760px){#modal{align-items:center}#mbox{border-radius:24px}}
#mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.tl{border-left:3px solid var(--line);margin:10px 0 0 8px;padding-left:14px;display:grid;gap:8px;font-size:14px}.tl b{display:block}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}
</style>
</head>
<body>
<section id="login">
  <form class="lbox" id="lform">
    <h1>Twinga Admin</h1><p>Sign in with your admin account.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn full" id="lbtn" type="submit">Sign in</button><div class="err" id="lerr"></div>
  </form>
</section>
<section id="app" class="hide">
  <header>
    <div class="top">
      <div class="logo">T</div><b>Admin</b>
      <div class="sw"><input id="gs" placeholder="Search orders, restaurants, riders, customers" autocomplete="off"><div id="sres" class="hide"></div></div>
      <button class="ib" id="snd" type="button" title="Alert sound">🔔</button>
      <button class="ib" id="thm" type="button" title="Theme">◐</button>
      <button class="ib" id="out" type="button">Log out</button>
    </div>
    <nav id="nav"></nav>
  </header>
  <main id="view"></main>
</section>
<div id="modal" class="hide"><div id="mbox"><div id="mhead"><h2 id="mtitle" style="margin:0"></h2><button class="btn ghost sm" data-act="close">Close</button></div><div id="mbody"></div></div></div>
<div id="toast" class="hide"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, setDoc, addDoc, deleteDoc, getDoc, getDocs, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const ADMIN_UID = "6EHDHFtlTBMrb43cgtu4FuEOLkg2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => (typeof v === "number" && isFinite(v) ? v : 0);
const rs = (p) => { const w = Math.trunc(num(p) / 100), r = Math.abs(num(p) % 100); return "₹" + w.toLocaleString("en-IN") + (r ? "." + String(r).padStart(2, "0") : ""); };
const ts = (t) => (t && typeof t.toDate === "function" ? t.toDate() : null);
const dt = (t) => { const d = ts(t); return d ? d.toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : ""; };
const tm = (t) => { const d = ts(t); return d ? d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }) : ""; };
const short = (id) => String(id).slice(-5).toUpperCase();
const ms = (t) => ts(t)?.getTime() || 0;
const mins = (a) => (a < 0 || !isFinite(a) ? "" : a < 60000 ? Math.round(a / 1000) + "s" : Math.round(a / 60000) + " min");
const LIVE = ["placed", "accepted", "preparing", "ready", "picked"];
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };

let toastTimer;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.remove("hide"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hide"), 3400); }

const photoSrc = (b) => "data:image/jpeg;base64," + b;
const photoImg = (b, css) => (b ? `<img alt="" src="${photoSrc(b)}" style="${css}">` : "");
function shrinkImage(file, maxSide, maxBytes) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let q = 0.82, out = c.toDataURL("image/jpeg", q);
      while (out.length > maxBytes * 1.37 && q > 0.35) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      if (out.length > maxBytes * 1.37) reject(new Error("This photo is too big. Please choose a smaller one."));
      else resolve(out.split(",")[1]);
    };
    img.onerror = () => reject(new Error("This file is not a photo."));
    img.src = url;
  });
}
let bannerImg = "";
const bannerPreview = () => (bannerImg ? photoImg(bannerImg, "width:100%;max-height:190px;object-fit:cover;border-radius:16px;display:block") : `<div class="empty">No photo yet. A colour banner with your title will be shown.</div>`);

function csv(rows) { return rows.map((r) => r.map((c) => { const s = String(c ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\n"); }
function download(name, rows) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv(rows)], { type: "text/csv" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- state ---------- */
const data = { restaurants: [], riders: [], payouts: [], orders: [], users: [], banners: [], coupons: [], deposits: [], logs: [], pricing: null };
const S = store.get("tw_state", { range: "7d", f: { restaurants: "pending", riders: "pending", payouts: "pending", orders: "all", customers: "all" }, q: {} });
let tab = "dashboard";
let unsubs = [];
const loaded = new Set();
let lastCounts = null;
let sound = store.get("tw_sound", true);

const byId = (arr) => Object.fromEntries(arr.map((x) => [x.id, x]));
const pendingCount = (k) => ({ restaurants: data.restaurants.filter((x) => x.status === "pending").length, riders: data.riders.filter((x) => x.status === "pending").length, payouts: data.payouts.filter((x) => x.status === "pending").length }[k] || 0);
const slaSec = () => num(data.pricing?.dispatchExpandAfterSec) || 120;
const unassigned = (o) => ["accepted", "preparing", "ready"].includes(o.status) && !o.riderUid && Date.now() - (ms(o.acceptedAt) || ms(o.createdAt)) > slaSec() * 1000;

const rangeStart = (r) => { const d = new Date(); d.setHours(0, 0, 0, 0); if (r === "today") return d; if (r === "7d") { d.setDate(d.getDate() - 6); return d; } if (r === "30d") { d.setDate(d.getDate() - 29); return d; } return null; };
const inRange = (o, r) => { const s = rangeStart(r); if (!s) return true; const d = ts(o.createdAt); return !!d && d >= s; };
const delivered = (arr) => arr.filter((o) => o.status === "delivered");
const sum = (arr, k) => arr.reduce((s, o) => s + num(o[k]), 0);

function agg(orders) {
  const d = delivered(orders);
  const done = orders.filter((o) => ["delivered", "cancelled", "rejected"].includes(o.status));
  const bad = orders.filter((o) => ["cancelled", "rejected"].includes(o.status));
  const acc = orders.filter((o) => ts(o.acceptedAt) && ts(o.createdAt)).map((o) => ms(o.acceptedAt) - ms(o.createdAt));
  const del = d.filter((o) => ts(o.updatedAt) && ts(o.createdAt)).map((o) => ms(o.updatedAt) - ms(o.createdAt));
  const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : -1);
  return {
    count: orders.length, delivered: d.length, bad: bad.length,
    badPct: done.length ? Math.round((bad.length / done.length) * 100) : 0,
    gmv: sum(d, "totalPaise"), food: sum(d, "foodSubtotalPaise"), commission: sum(d, "commissionPaise"),
    discount: sum(d, "discountPaise"), platform: sum(d, "platformFeePaise"), delivery: sum(d, "deliveryPaise"), riderPay: sum(d, "riderPayPaise"),
    gst: sum(d, "foodGstPaise") + sum(d, "gstOnFeesPaise"), packaging: sum(d, "packagingPaise"),
    aov: d.length ? Math.round(sum(d, "totalPaise") / d.length) : 0,
    avgAccept: avg(acc), avgDelivery: avg(del),
  };
}

/* ---------- ui pieces ---------- */
const pill = (s) => `<span class="pill p-${esc(s)}">${esc(s || "unknown")}</span>`;
const kv = (a, b) => (b === "" || b == null ? "" : `<div><span>${esc(a)}</span><span>${b}</span></div>`);
const empty = (t) => `<div class="empty">${esc(t)}</div>`;
const copyBtn = (t) => (t ? `<button class="copy" data-copy="${esc(t)}" type="button">Copy</button>` : "");
const mapLink = (lat, lng) => (typeof lat === "number" && typeof lng === "number" ? `<a class="map" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${lat},${lng}">${lat.toFixed(5)}, ${lng.toFixed(5)}</a>` : "");
const stat = (label, value, cls = "", sub = "") => `<div class="stat ${cls}"><small>${label}</small><b>${value}</b>${sub ? `<i>${sub}</i>` : ""}</div>`;
const chips = (group, opts, store_ = "f") => `<div class="chips">${opts.map(([v, l]) => `<button class="chip ${(store_ === "f" ? S.f[group] : S[group]) === v ? "on" : ""}" data-filter="${group}" data-v="${v}" data-st="${store_}">${l}</button>`).join("")}</div>`;
const searchBox = (ph) => `<div class="chips"><input id="q" placeholder="${ph}" value="${esc(S.q[tab] || "")}" style="max-width:360px"></div>`;
const rangeChips = () => chips("range", [["today", "Today"], ["7d", "7 days"], ["30d", "30 days"], ["all", "All time"]], "r");

function barChart(vals, labels, fmt = (v) => v) {
  const W = 340, H = 150, pad = 22, max = Math.max(1, ...vals), bw = (W - 10) / vals.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  vals.forEach((v, i) => {
    const h = ((H - pad - 14) * v) / max, x = 5 + i * bw, y = H - pad - h;
    s += `<rect x="${x + bw * 0.15}" y="${y}" width="${bw * 0.7}" height="${Math.max(h, 0)}" rx="3" fill="var(--blue)"/>`;
    if (v > 0 && vals.length <= 14) s += `<text x="${x + bw / 2}" y="${y - 3}" text-anchor="middle" font-size="9" fill="var(--muted)">${fmt(v)}</text>`;
    if (labels[i]) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="9" fill="var(--muted)">${labels[i]}</text>`;
  });
  return s + "</svg>";
}
function rankRows(rows, fmt) {
  if (!rows.length) return empty("No data yet.");
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return rows.map((r) => `<div style="margin-bottom:10px"><div class="row"><span>${esc(r[0])}</span><b>${fmt(r[1])}</b></div><div class="bar"><i style="width:${Math.round((r[1] / max) * 100)}%"></i></div></div>`).join("");
}

/* ---------- modal ---------- */
function openModal(title, html) { $("mtitle").textContent = title; $("mbody").innerHTML = html; $("modal").classList.remove("hide"); $("mbox").scrollTop = 0; }
function closeModal() { $("modal").classList.add("hide"); $("mbody").innerHTML = ""; }

/* ---------- audit log ---------- */
async function log(action, target, detail = "") { try { await addDoc(collection(db, "adminLogs"), { action, target, detail, at: serverTimestamp() }); } catch (_) {} }

/* ---------- views ---------- */
function viewDashboard() {
  const orders = data.orders.filter((o) => inRange(o, S.range));
  const a = agg(orders);
  const live = data.orders.filter((o) => LIVE.includes(o.status));
  const un = data.orders.filter(unassigned);
  const online = data.riders.filter((r) => r.status === "approved" && r.isOnline).length;
  const net = a.commission + a.platform + a.delivery - a.riderPay - a.discount;
  // charts
  let vals = [], labels = [], sales = [];
  if (S.range === "today") {
    vals = Array(24).fill(0); sales = Array(24).fill(0);
    orders.forEach((o) => { const d = ts(o.createdAt); if (d) { vals[d.getHours()]++; if (o.status === "delivered") sales[d.getHours()] += num(o.totalPaise); } });
    labels = vals.map((_, i) => (i % 3 === 0 ? i + "h" : ""));
  } else {
    const n = S.range === "7d" ? 7 : 30; vals = Array(n).fill(0); sales = Array(n).fill(0);
    const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - (n - 1));
    data.orders.forEach((o) => { const d = ts(o.createdAt); if (!d) return; const i = Math.floor((d - start) / 86400000); if (i >= 0 && i < n) { vals[i]++; if (o.status === "delivered") sales[i] += num(o.totalPaise); } });
    labels = vals.map((_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return n === 7 || i % 5 === 0 ? d.getDate() + "/" + (d.getMonth() + 1) : ""; });
  }
  const hours = Array(24).fill(0); orders.forEach((o) => { const d = ts(o.createdAt); if (d) hours[d.getHours()]++; });
  const statusMix = ["placed", "accepted", "preparing", "ready", "picked", "delivered", "cancelled", "rejected"].map((s) => [s, orders.filter((o) => o.status === s).length]).filter((x) => x[1] > 0);
  const rmap = byId(data.restaurants);
  const topRest = Object.entries(delivered(orders).reduce((m, o) => ((m[o.restaurantId] = (m[o.restaurantId] || 0) + num(o.foodSubtotalPaise)), m), {})).map(([id, v]) => [rmap[id]?.name || id, v]).sort((x, y) => y[1] - x[1]).slice(0, 5);

const PRICING_GROUPS = [
  ["Fees and taxes", [["commissionPct", "Commission on food", "percent"], ["foodGstPct", "GST on food and packaging", "percent"], ["gstFeesPct", "GST on fees", "percent"], ["platformFeePaise", "Platform fee", "paise (1000 = ₹10)"]]],
  ["Customer delivery charge", [["deliveryBaseKm", "Base distance", "km"], ["deliveryBasePaise", "Charge up to base km", "paise"], ["deliveryExtraPerKmPaise", "Charge per extra km", "paise"]]],
  ["Rider pay", [["riderMinKm", "Minimum distance paid", "km"], ["riderBaseKm", "Base distance", "km"], ["riderBasePerKmPaise", "Pay per km up to base", "paise"], ["riderExtraPerKmPaise", "Pay per extra km", "paise"]]],
  ["Rider search", [["dispatchRadiusKm", "Search radius", "km"], ["dispatchExpandedRadiusKm", "Radius after waiting", "km"], ["dispatchExpandAfterSec", "Widen search after", "seconds"]]],
];
function simulate(p, food, pack, km) {
  const P = (k) => num(p[k]), foodP = Math.round(food * 100), packP = Math.round(pack * 100);
  const gstFood = Math.round(((foodP + packP) * P("foodGstPct")) / 100);
  const delivery = P("deliveryBasePaise") + Math.round(Math.max(0, km - P("deliveryBaseKm")) * P("deliveryExtraPerKmPaise"));
  const fees = delivery + P("platformFeePaise"), gstFees = Math.round((fees * P("gstFeesPct")) / 100);
  const total = Math.round((foodP + packP + gstFood + fees + gstFees) / 100) * 100;
  const commission = Math.round((foodP * P("commissionPct")) / 100), rk = Math.max(P("riderMinKm"), km);
  const rider = Math.round(Math.min(rk, P("riderBaseKm")) * P("riderBasePerKmPaise") + Math.max(0, rk - P("riderBaseKm")) * P("riderExtraPerKmPaise"));
  return { foodP, packP, gstFood, delivery, platform: P("platformFeePaise"), gstFees, total, commission, rider, restaurant: foodP - commission, net: commission + delivery + P("platformFeePaise") - rider };
}
function simHtml() {
  const p = data.pricing; if (!p) return "";
  const f = Number($("sim-f")?.value || 400), k = Number($("sim-p")?.value || 20), d = Number($("sim-d")?.value || 3), s = simulate(p, f, k, d);
  return `<div class="kv">${kv("Food", rs(s.foodP))}${kv("Packaging", rs(s.packP))}${kv("GST on food", rs(s.gstFood))}${kv("Delivery", rs(s.delivery))}${kv("Platform fee", rs(s.platform))}${kv("GST on fees", rs(s.gstFees))}<div><span><b>Customer pays</b></span><span><b>${rs(s.total)}</b></span></div>${kv("Restaurant gets", rs(s.restaurant))}${kv("Rider gets", rs(s.rider))}${kv("Twinga keeps", rs(s.net))}</div>`;
}

/* ---------- detail modals ---------- */
function form(fields, v = {}) {
  return `<div class="form">${fields.map(([k, l, t]) => {
    const val = v[k];
    if (t === "check") return `<label><input type="checkbox" id="f-${k}" style="width:auto" ${val ? "checked" : ""}> ${l}</label>`;
    if (t.startsWith("select:")) return `<label>${l}<select id="f-${k}">${t.slice(7).split("|").map((o) => `<option ${val === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>`;
    return `<label>${l}<input id="f-${k}" type="${t === "number" ? "text" : t}" ${t === "number" ? 'inputmode="decimal"' : ""} value="${esc(val ?? "")}"></label>`;
  }).join("")}</div>`;
}

/* ---------- actions ---------- */
async function run(label, fn, keepModal) { try { await fn(); toast(label); if (!keepModal) closeModal(); } catch (e) { toast("Failed: " + (e?.code || e?.message || "unknown error")); } }
const upd = (c, id, v) => updateDoc(doc(db, c, id), v);

const ACTIONS = {
  close: async () => closeModal(),
  rstatus: (b) => run(b.dataset.s === "approved" ? "Restaurant approved" : "Restaurant rejected", async () => { const r = ($("reason")?.value || "").trim(); await upd("restaurants", b.dataset.id, { status: b.dataset.s, reviewedAt: serverTimestamp(), ...(b.dataset.s === "rejected" ? { rejectReason: r } : {}) }); log("restaurant " + b.dataset.s, b.dataset.id, r); }),
  ristatus: (b) => run(b.dataset.s === "approved" ? "Rider approved" : "Rider rejected", async () => { const r = ($("reason")?.value || "").trim(); await upd("riders", b.dataset.id, { status: b.dataset.s, reviewedAt: serverTimestamp(), ...(b.dataset.s === "rejected" ? { rejectReason: r, isOnline: false } : {}) }); log("rider " + b.dataset.s, b.dataset.id, r); }),
  rtoggle: (b) => run("Updated", async () => { const r = data.restaurants.find((x) => x.id === b.dataset.id); await upd("restaurants", b.dataset.id, { isOpen: !r.isOpen }); log(r.isOpen ? "force close" : "force open", r.name); }),
  rsave: (b) => run("Settings saved", async () => { const v = { deliveryRadiusKm: Number($("e-rad").value), packagingChargePaise: Math.round(Number($("e-pack").value) * 100), prepTimeMin: Number($("e-prep").value) }; if (!(v.deliveryRadiusKm > 0 && v.deliveryRadiusKm <= 15) || !(v.packagingChargePaise >= 0) || !(v.prepTimeMin >= 5)) throw { message: "Check radius (1-15), packaging and prep time" }; await upd("restaurants", b.dataset.id, v); log("restaurant settings", b.dataset.id, JSON.stringify(v)); }),
  roffline: (b) => run("Rider is offline", async () => { await upd("riders", b.dataset.id, { isOnline: false }); log("force offline", b.dataset.id); }),
  paid: (b) => run("Marked as paid", async () => { const n = ($("note-" + b.dataset.id).value || "").trim(); await upd("payouts", b.dataset.id, { status: "paid", utr: n, paidAt: serverTimestamp() }); log("withdrawal paid", b.dataset.id, n); }, true),
  payrej: (b) => run("Withdrawal rejected", async () => { const n = ($("note-" + b.dataset.id).value || "").trim(); await upd("payouts", b.dataset.id, { status: "rejected", note: n, reviewedAt: serverTimestamp() }); log("withdrawal rejected", b.dataset.id, n); }, true),
  cancelorder: (b) => run("Order cancelled", async () => { await upd("orders", b.dataset.id, { status: "cancelled", cancelReason: "Cancelled by Twinga", updatedAt: serverTimestamp() }); log("order cancelled", b.dataset.id); }),
  assignopen: async (b) => openAssign(b.dataset.id),
  assign: (b) => run("Rider assigned", async () => { const r = data.riders.find((x) => x.id === $("asg").value); await upd("orders", b.dataset.id, { riderUid: r.id, riderName: r.name, riderPhone: r.phone || "", assignedBy: "admin", updatedAt: serverTimestamp() }); log("rider assigned", b.dataset.id, r.name); }),
  showotp: async (b) => { try { const s = await getDoc(doc(db, "orders", b.dataset.id, "secrets", "otp")); $("o-otp").innerHTML = `<b style="font-size:18px;letter-spacing:3px">${esc(s.data()?.code ?? "n/a")}</b>`; log("viewed otp", b.dataset.id); } catch (_) { toast("Could not read OTP"); } },
  depopen: async (b) => openDeposit(b.dataset.id),
  deposit: (b) => run("Deposit recorded", async () => { const a = Math.round(Number($("dep-a").value) * 100); if (!(a > 0)) throw { message: "Enter the amount" }; await addDoc(collection(db, "cashDeposits"), { riderUid: b.dataset.id, amountPaise: a, note: $("dep-n").value.trim(), createdAt: serverTimestamp() }); log("cash deposit", b.dataset.id, rs(a)); }),
  notify: async () => {
    try {
      const to = $("n-to").value, title = $("n-title").value.trim(), body = $("n-body").value.trim();
      if (!title || !body) throw { message: "Enter the title and the message" };
      const user = auth.currentUser;
      if (!user) throw { message: "Please log in again" };
      const token = await user.getIdToken();
      const res = await fetch(NOTIFY_API + "/notify", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + token }, body: JSON.stringify({ to, title, body }) });
      const j = await res.json().catch(() => ({}));
      if (!res.ok || !j.ok) throw { message: j.error || "Could not send" };
      log("notification sent", to, title);
      $("n-title").value = "";
      $("n-body").value = "";
      toast("Notification sent");
    } catch (e) { toast("Failed: " + (e?.message || e?.code || "unknown error")); }
  },
  bpick: async () => { $("bn-file").click(); },
  bimgclear: async () => { bannerImg = ""; $("bn-prev").innerHTML = bannerPreview(); },
  bsave: (b) => run("Banner saved", async () => { const v = { ...readForm(BANNER_F), imageData: bannerImg }; if (!v.title) throw { message: "Enter a title" }; if (b.dataset.id === "new") await addDoc(collection(db, "banners"), { ...v, createdAt: serverTimestamp() }); else await upd("banners", b.dataset.id, v); log("banner saved", v.title); }),
  bdel: (b) => run("Banner deleted", async () => { await deleteDoc(doc(db, "banners", b.dataset.id)); log("banner deleted", b.dataset.id); }),
  csave: (b) => run("Coupon saved", async () => { const f = readForm(COUPON_F); const code = f.code.toUpperCase().replace(/\s+/g, ""); if (!code) throw { message: "Enter a code" }; if (!(f.value > 0)) throw { message: "Enter the value" }; const v = { code, description: f.description, type: f.type, value: f.value, minOrderPaise: Math.round(f.minOrder * 100), maxDiscountPaise: Math.round(f.maxDiscount * 100), usageLimit: f.usageLimit, active: f.active, expiresAt: f.expires ? Timestamp.fromDate(new Date(f.expires + "T23:59:59")) : null }; if (b.dataset.id === "new") await addDoc(collection(db, "coupons"), { ...v, usedCount: 0, createdAt: serverTimestamp() }); else await upd("coupons", b.dataset.id, v); log("coupon saved", code); }),
  cdel: (b) => run("Coupon deleted", async () => { await deleteDoc(doc(db, "coupons", b.dataset.id)); log("coupon deleted", b.dataset.id); }),
  saveprice: () => run("Pricing saved", async () => { const out = {}; for (const i of document.querySelectorAll("[data-price]")) { const v = Number(i.value.trim()); if (i.value.trim() === "" || !isFinite(v) || v < 0) throw { message: "Check the value for " + i.dataset.price }; out[i.dataset.price] = v; } await setDoc(doc(db, "config", "pricing"), out, { merge: true }); log("pricing changed", "config/pricing", JSON.stringify(out)); }, true),
  csv: async (b) => {
    const k = b.dataset.id, rmap = byId(data.restaurants);
    if (k === "orders") download("orders.csv", [["Order", "Placed", "Status", "Restaurant", "Customer", "Rider", "Food", "Packaging", "GST food", "Delivery", "Platform fee", "GST fees", "Round off", "Total", "Commission", "Rider pay", "Coupon discount", "Coupon"], ...ordersFiltered().map((o) => [o.id, dt(o.createdAt), o.status, o.restaurantName, o.customerName, o.riderName, ...["foodSubtotalPaise", "packagingPaise", "foodGstPaise", "deliveryPaise", "platformFeePaise", "gstOnFeesPaise", "roundOffPaise", "totalPaise", "commissionPaise", "riderPayPaise", "discountPaise"].map((f) => num(o[f]) / 100), o.couponCode || ""])]);
    else if (k === "restaurants") download("restaurants.csv", [["Name", "Status", "Phone", "Cuisines", "FSSAI", "Address", "Lat", "Lng", "Radius km"], ...data.restaurants.map((r) => [r.name, r.status, r.phone, r.cuisines, r.fssai, r.addressLine, r.lat, r.lng, r.deliveryRadiusKm])]);
    else if (k === "riders") download("riders.csv", [["Name", "Status", "Phone", "Vehicle", "Number", "City", "Trips", "Earned"], ...data.riders.map((r) => { const s = riderStats(r.id); return [r.name, r.status, r.phone, r.vehicleType, r.vehicleNumber, r.city, s.trips, s.earned / 100]; })]);
    else if (k === "customers") download("customers.csv", [["Name", "Email", "Joined", "Orders", "Spent"], ...data.users.filter((u) => u.role === "customer").map((u) => { const s = custStats(u.id); return [u.name, u.email, dt(u.createdAt), s.count, s.spent / 100]; })]);
    else if (k === "payouts") download("withdrawals.csv", [["Requested", "For", "Role", "Amount", "Status", "Method", "Holder", "UPI", "Bank", "Account", "IFSC", "UTR"], ...data.payouts.map((p) => [dt(p.createdAt), ownerName(p), p.role, num(p.amountPaise) / 100, p.status, p.method, p.holderName, p.upiId, p.bankName, p.accountNumber, p.ifsc, p.utr])]);
    else if (k === "settle-rest") download("restaurant-settlements.csv", [["Restaurant", "Orders", "Food sales", "Commission", "Earned", "Paid", "Pending", "Available"], ...settlements().rest.map((x) => [x.r.name, x.n, x.food / 100, x.com / 100, x.earned / 100, x.paid / 100, x.pend / 100, x.avail / 100])]);
    else if (k === "settle-rider") download("rider-settlements.csv", [["Rider", "Trips", "Earned", "Paid out", "Available", "Cash collected", "Deposited", "To deposit"], ...settlements().rid.map((x) => [x.r.name, x.s.trips, x.s.earned / 100, x.paid / 100, x.avail / 100, x.s.cash / 100, x.dep / 100, x.owe / 100])]);
    void rmap;
  },
};

document.addEventListener("click", async (e) => {
  const op = e.target.closest("[data-open]");
  const t = e.target.closest("button");
  if (!t || (op && t === op) || (op && !t.dataset.act && !t.dataset.tab && !t.dataset.filter && !t.dataset.copy)) {
    if (op) { const [k, id] = op.dataset.open.split(":"); ({ order: openOrder, rest: openRest, rider: openRider, cust: openCust, banner: openBanner, coupon: openCoupon })[k]?.(id); $("sres").classList.add("hide"); return; }
    if (e.target === $("modal")) closeModal();
    if (!t) return;
  }
  if (t.dataset.tab) { tab = t.dataset.tab; window.scrollTo(0, 0); return render(); }
  if (t.dataset.filter) { if (t.dataset.st === "r") S.range = t.dataset.v; else S.f[t.dataset.filter] = t.dataset.v; store.set("tw_state", S); return render(); }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Copied"); } catch (_) { toast("Copy not allowed here. Select the text and copy it."); } return; }
  if (t.dataset.act) {
    if (t.dataset.confirm && !t.dataset.armed) { t.dataset.armed = "1"; t.dataset.label = t.textContent; t.textContent = "Tap again to confirm"; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = t.dataset.label; } }, 4000); return; }
    t.disabled = true; await ACTIONS[t.dataset.act]?.(t); if (t.isConnected) t.disabled = false;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "q") { S.q[tab] = e.target.value; store.set("tw_state", S); if (RESULTS[tab]) $("results").innerHTML = RESULTS[tab](); }
  if (/^sim-/.test(e.target.id || "")) $("sim-out").innerHTML = simHtml();
  if (e.target.id === "gs") globalSearch(e.target.value);
});

document.addEventListener("change", async (e) => {
  if (e.target.id !== "bn-file" || !e.target.files[0]) return;
  try { bannerImg = await shrinkImage(e.target.files[0], 1000, 200 * 1024); $("bn-prev").innerHTML = bannerPreview(); toast("Photo ready. Tap Save banner."); }
  catch (err) { toast(err.message || "Could not read this photo"); }
  e.target.value = "";
});

function globalSearch(v) {
  const q = v.trim().toLowerCase(), box = $("sres"); if (q.length < 2) { box.classList.add("hide"); return; }
  const has = (...a) => a.some((x) => String(x || "").toLowerCase().includes(q)), out = [];
  data.orders.filter((o) => has(o.id, short(o.id), o.customerName, o.restaurantName)).slice(0, 5).forEach((o) => out.push([`order:${o.id}`, `Order #${short(o.id)}`, `${o.restaurantName} · ${o.customerName} · ${o.status}`]));
  data.restaurants.filter((r) => has(r.name, r.phone)).slice(0, 4).forEach((r) => out.push([`rest:${r.id}`, r.name, "Restaurant · " + (r.phone || "")]));
  data.riders.filter((r) => has(r.name, r.phone, r.vehicleNumber)).slice(0, 4).forEach((r) => out.push([`rider:${r.id}`, r.name, "Rider · " + (r.phone || "")]));
  data.users.filter((u) => u.role === "customer" && has(u.name, u.email)).slice(0, 4).forEach((u) => out.push([`cust:${u.id}`, u.name || "Customer", "Customer · " + (u.email || "")]));
  box.innerHTML = out.length ? out.map((r) => `<div data-open="${esc(r[0])}"><b>${esc(r[1])}</b><br><small>${esc(r[2])}</small></div>`).join("") : `<div><small>No results</small></div>`;
  box.classList.remove("hide");
}

/* ---------- alerts ---------- */
function beep() { if (!sound) return; try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); setTimeout(() => { o.stop(); c.close(); }, 350); } catch (_) {} }
function checkAlerts() {
  if (loaded.size < 4) return;
  const c = { orders: data.orders.filter((o) => o.status === "placed").length, rest: pendingCount("restaurants"), riders: pendingCount("riders"), pay: pendingCount("payouts") };
  if (lastCounts) {
    if (c.orders > lastCounts.orders) { beep(); toast("New order received"); }
    else if (c.rest > lastCounts.rest) { beep(); toast("New restaurant waiting for approval"); }
    else if (c.riders > lastCounts.riders) { beep(); toast("New rider waiting for approval"); }
    else if (c.pay > lastCounts.pay) { beep(); toast("New withdrawal request"); }
  }
  lastCounts = c;
}

/* ---------- data ---------- */
function listen(name, ref) {
  unsubs.push(onSnapshot(ref, (snap) => { data[name] = snap.docs.map((d) => ({ id: d.id, ...d.data() })); loaded.add(name); checkAlerts(); render(); }, (err) => toast("Could not load " + name + ": " + err.code)));
}
function start() {
  listen("restaurants", collection(db, "restaurants")); listen("riders", collection(db, "riders")); listen("payouts", collection(db, "payouts")); listen("orders", collection(db, "orders"));
  listen("users", collection(db, "users")); listen("banners", collection(db, "banners")); listen("coupons", collection(db, "coupons"));
  listen("deposits", collection(db, "cashDeposits")); listen("logs", collection(db, "adminLogs"));
  unsubs.push(onSnapshot(doc(db, "config", "pricing"), (s) => { data.pricing = s.exists() ? s.data() : null; render(); }));
}
function stop() { unsubs.forEach((u) => u()); unsubs = []; loaded.clear(); lastCounts = null; }
setInterval(() => { if (tab === "live" && !$("app").classList.contains("hide")) render(); }, 20000);

/* ---------- auth and chrome ---------- */
$("snd").textContent = sound ? "🔔" : "🔕";
$("snd").addEventListener("click", () => { sound = !sound; store.set("tw_sound", sound); $("snd").textContent = sound ? "🔔" : "🔕"; if (sound) beep(); toast(sound ? "Alert sound on" : "Alert sound off"); });
const setTheme = (t) => { document.documentElement.dataset.theme = t; store.set("tw_theme", t); };
setTheme(store.get("tw_theme", "light"));
$("thm").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
$("lform").addEventListener("submit", async (e) => { e.preventDefault(); $("lerr").textContent = ""; $("lbtn").disabled = true; try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); } catch (_) { $("lerr").textContent = "Wrong email or password, or no internet."; } $("lbtn").disabled = false; });
$("out").addEventListener("click", () => signOut(auth));
onAuthStateChanged(auth, (user) => {
  if (user && user.uid === ADMIN_UID) { $("login").classList.add("hide"); $("app").classList.remove("hide"); start(); }
  else { stop(); $("app").classList.add("hide"); $("login").classList.remove("hide"); if (user) { $("lerr").textContent = "This account is not the Twinga admin."; signOut(auth); } }
});
</script>
