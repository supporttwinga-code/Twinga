name: Build Rider APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/rider/**'
      - '.github/workflows/build-rider.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter create --platforms=android --org com.twinga --project-name rider .
      - name: Limit Gradle memory
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "kotlin.daemon.jvm.options=-Xmx1g" >> android/gradle.properties
          echo "org.gradle.workers.max=2" >> android/gradle.properties
      - name: Set app icon (assets/icon.png)
        continue-on-error: true
        run: |
          if [ -f assets/icon.png ]; then
            pip install pillow > /dev/null 2>&1 || true
            python3 - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.open('assets/icon.png').convert('RGBA')
          w, h = im.size
          for pt in [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]:
              px = im.getpixel(pt)
              if px[3] > 0 and px[0] < 40 and px[1] < 40 and px[2] < 40:
                  ImageDraw.floodfill(im, pt, (0, 0, 0, 0), thresh=60)
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              im.resize((s, s), Image.LANCZOS).save('android/app/src/main/res/mipmap-' + d + '/ic_launcher.png')
          print('Icon replaced')
          PY
          else
            echo "No assets/icon.png found, keeping the default icon"
          fi
      - run: sed -i 's/android:label="[^"]*"/android:label="Twinga Rider"/' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's#<application#<queries><intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub add firebase_core firebase_auth firebase_messaging cloud_firestore geolocator url_launcher image_picker
      - name: Generate firebase_options.dart
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('google-services.json'))
          pkg = 'com.twinga.rider'
          client = None
          for c in d['client']:
              if c['client_info']['android_client_info']['package_name'] == pkg:
                  client = c
                  break
          if client is None:
              raise SystemExit('google-services.json has no client for ' + pkg)
          opts = {
              'apiKey': client['api_key'][0]['current_key'],
              'appId': client['client_info']['mobilesdk_app_id'],
              'messagingSenderId': d['project_info']['project_number'],
              'projectId': d['project_info']['project_id'],
          }
          bucket = d['project_info'].get('storage_bucket')
          if bucket:
              opts['storageBucket'] = bucket
          body = ''.join("    %s: '%s',\n" % (k, v) for k, v in opts.items())
          src = ("import 'package:firebase_core/firebase_core.dart';\n\n"
                 "class DefaultFirebaseOptions {\n"
                 "  static const FirebaseOptions android = FirebaseOptions(\n"
                 + body + "  );\n}\n")
          open('lib/firebase_options.dart', 'w').write(src)
          res = {'google_app_id': opts['appId'], 'gcm_defaultSenderId': opts['messagingSenderId'], 'google_api_key': opts['apiKey'], 'google_crash_reporting_api_key': opts['apiKey'], 'project_id': opts['projectId']}
          if bucket:
              res['google_storage_bucket'] = bucket
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n' + ''.join('    <string name="%s" translatable="false">%s</string>\n' % (k, v) for k, v in res.items()) + '</resources>\n'
          open('android/app/src/main/res/values/google_services.xml', 'w').write(xml)
          print('firebase_options.dart written for project', opts['projectId'])
          PY
      - name: Build release APK (arm64, retries once)
        run: |
          flutter build apk --release --target-platform android-arm64 || (sleep 30 && flutter build apk --release --target-platform android-arm64)
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk twinga-rider.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rider-${{ github.run_number }}
          name: Rider build ${{ github.run_number }}
          prerelease: true
          files: apps/rider/twinga-rider.apk
      - name: Also keep a 1-day artifact (optional)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: twinga-rider
          path: apps/rider/twinga-rider.apk
          retention-days: 1
